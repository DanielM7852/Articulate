[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "articulate-model-collector"
version = "0.1.0"
description = "Independent SPARC, ARTI-6 and speech-activity data collection"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "soundfile==0.13.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
models = [
  "torch==2.8.0", "torchaudio==2.8.0", "transformers==4.57.1",
  "huggingface-hub==0.35.3", "librosa==0.11.0", "torchcrepe==0.0.23",
  "scikit-learn==1.7.2", "speechbrain==1.0.3", "loralib==0.1.2",
  "numba==0.62.1",
  "silero-vad==6.2.3", "onnxruntime>=1.20,<2",
  "speech-articulatory-coding @ git+https://github.com/Berkeley-Speech-Group/Speech-Articulatory-Coding.git@d59139be64cdbd5a6cb76c73fda00af0d0e97e59",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
articulate-models = "articulate_models.__main__:main"

[tool.setuptools.packages.find]
include = ["articulate_models*"]

[tool.setuptools.package-data]
articulate_models = ["models.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: local real-model smoke tests (requires prepared checkpoints)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
