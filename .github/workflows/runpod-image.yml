name: RunPod image
on:
  push:
    branches: [feature/runpod-phones]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - backend/**
      - web/**
      - mouth-demo/**
      - vowel-mapper/**
      - services/articulation/**
      - services/phones/**
      - .github/workflows/runpod-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/articulate" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:runpod-phones"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Disk after build
        if: always()
        run: df -h /
