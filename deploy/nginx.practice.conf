resolver 127.0.0.11 valid=10s;
upstream practice_api {
  zone practice_api 64k;
  server practice-api:8000 resolve;
  keepalive 32;
}
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  location /v1/ {
    proxy_pass http://practice_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 65s;
  }
  location /health/ { proxy_pass http://practice_api; }
  location / { try_files $uri /index.html; }
}
